# DAPO-lite (Yu et al., NeurIPS 2025) with the process reward.
# Implemented: clip-higher, token-mean loss, no KL, overlong reward shaping.
# Dynamic sampling is not implemented in verl 0.5.0 (filter_groups is config
# only), so this is the config-expressible subset, as in the MedQA demo.
defaults:
  - ppo_trainer
  - arithmetic_base
  - _self_

hydra:
  searchpath:
    - pkg://verl.trainer.config
  job:
    chdir: false

custom_reward_function:
  reward_kwargs:
    mode: process
    final_weight: 1.0
    process_weight: 0.5
    format_weight: 0.1
    invalid_penalty: 0.05

reward_model:
  reward_manager: arithmetic_process
  reward_kwargs:
    overlong_len: 288
    max_resp_len: 320
    overlong_penalty_factor: 0.1

actor_rollout_ref:
  actor:
    use_kl_loss: false
    clip_ratio_low: 0.2
    clip_ratio_high: 0.28
    loss_agg_mode: token-mean

algorithm:
  adv_estimator: grpo
  norm_adv_by_std_in_grpo: true

trainer:
  experiment_name: arithmetic_dapo_process
  default_local_dir: verl_impl/outputs/arithmetic_dapo_process
  rollout_data_dir: verl_impl/outputs/arithmetic_dapo_process/rollout
  validation_data_dir: verl_impl/outputs/arithmetic_dapo_process/val

demo:
  output_dir: verl_impl/outputs/arithmetic_dapo_process/hooks
