# Difficulty-weighted Dr.GRPO with the process reward.
# Saturated groups (all-correct / all-wrong) are downweighted by reward std^alpha.
defaults:
  - ppo_trainer
  - arithmetic_base
  - _self_

hydra:
  searchpath:
    - pkg://verl.trainer.config
  job:
    chdir: false

custom_reward_function:
  reward_kwargs:
    mode: process
    final_weight: 1.0
    process_weight: 0.5
    format_weight: 0.1
    invalid_penalty: 0.05

algorithm:
  adv_estimator: difficulty_grpo
  difficulty_alpha: 1.0
  difficulty_norm_by_std: false

trainer:
  experiment_name: arithmetic_difficulty_process
  default_local_dir: verl_impl/outputs/arithmetic_difficulty_process
  rollout_data_dir: verl_impl/outputs/arithmetic_difficulty_process/rollout
  validation_data_dir: verl_impl/outputs/arithmetic_difficulty_process/val

demo:
  output_dir: verl_impl/outputs/arithmetic_difficulty_process/hooks
